<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>@font-face{font-family:'Figtree';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format('woff2');}
@font-face{font-family:'Figtree';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/figtree-latin-600-normal.woff2) format('woff2');}
@font-face{font-family:'Figtree';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/figtree-latin-700-normal.woff2) format('woff2');}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format('woff2');}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format('woff2');}
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Pattern Roll</title>
<style>
/* Layout: the paper sheet stays pinned at the top on a phone and sits on the left on wide screens; the controls scroll beneath or beside it. */
:root {
  --bg: #EDF0EE;
  --surface: #FAFBFA;
  --fg: #16201E;
  --muted: #56635E;
  --line: #D5DBD8;
  --line-strong: #AEB9B5;
  --accent: #0B7A75;
  --on-accent: #FFFFFF;
  --shadow: rgba(18, 38, 34, 0.30);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1514;
    --surface: #18201F;
    --fg: #E7EEEC;
    --muted: #93A19C;
    --line: #2A3533;
    --line-strong: #43524E;
    --accent: #4FD1C5;
    --on-accent: #06201D;
    --shadow: rgba(0, 0, 0, 0.60);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1514;
  --surface: #18201F;
  --fg: #E7EEEC;
  --muted: #93A19C;
  --line: #2A3533;
  --line-strong: #43524E;
  --accent: #4FD1C5;
  --on-accent: #06201D;
  --shadow: rgba(0, 0, 0, 0.60);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 15px/1.45 var(--font-body);
  padding-inline: 16px;
  padding-block: 8px 104px;
}
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top {
  max-width: 1100px;
  margin-inline: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-block: 6px 10px;
}
h1 {
  margin: 0;
  font: 800 24px/1 var(--font-display);
  letter-spacing: -0.01em;
}
.btn {
  min-height: 42px;
  padding: 11px 18px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: var(--on-accent);
  font: 700 14px/1 var(--font-body);
  cursor: pointer;
}
.btn:active { transform: translateY(1px); }

.app {
  max-width: 1100px;
  margin-inline: auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 14px;
}
.sheet-wrap {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 3;
  background: var(--bg);
  padding-block: 2px 8px;
}
.sheet {
  --maxh: clamp(200px, 34vh, 360px);
  height: var(--maxh);
  margin-inline: auto;
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 1px 0 var(--line), 0 12px 24px -16px var(--shadow);
}
.sheet.fixed {
  height: auto;
  width: min(100%, calc(var(--maxh) * var(--ar)));
  aspect-ratio: var(--ar);
}
#sheet {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: pointer;
}
.perf {
  margin-top: 8px;
  padding-top: 5px;
  border-top: 2px dashed var(--line-strong);
  text-align: center;
  font: 600 10px/1 var(--font-body);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
}

.controls {
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.group {
  display: grid;
  gap: 12px;
  padding: 16px;
  border-top: 1px solid var(--line);
}
.group:first-child { border-top: 0; }
.group h2 {
  margin: 0;
  font: 700 11px/1 var(--font-body);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}
.field { display: grid; gap: 6px; }
.lab { font: 600 13px/1.2 var(--font-body); color: var(--muted); }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .chip {
  min-height: 48px;
  padding: 10px 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: transparent;
  color: var(--fg);
  font: 600 14px/1 var(--font-body);
  cursor: pointer;
  transition: background 0.12s, color 0.12s, transform 0.08s;
}
.seg button:active, .chip:active, .step:active, .dockbtn:active { transform: scale(0.97); }
.ico { display: inline-flex; flex: none; }
.ico svg { display: block; }
.seg button[aria-pressed="true"], .chip[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
}
.chip:disabled { opacity: 0.45; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.tray {
  max-height: 340px;
  overflow-y: auto;
  align-content: start;
  grid-auto-rows: max-content;
  padding: 3px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
  gap: 8px;
}
.motif {
  position: relative;
  padding: 0;
  overflow: hidden;
  border: 2px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  cursor: pointer;
  display: block;
  min-width: 0;
}
.motif { aspect-ratio: 1; }
.motif canvas { display: block; width: 100%; height: 100%; }
.motif[data-n]::after {
  content: attr(data-n);
  position: absolute;
  top: 4px;
  right: 4px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--on-accent);
  font: 700 11px/18px var(--font-body);
  text-align: center;
}
.motif[aria-pressed="true"] {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent);
}
.mixbar { display: flex; gap: 8px; }
.mixbar button {
  position: relative;
  flex: 1 1 0;
  max-width: 76px;
  aspect-ratio: 1;
  padding: 0;
  overflow: hidden;
  border: 2px solid var(--accent);
  border-radius: 10px;
  background: var(--bg);
  color: var(--muted);
  font: 700 20px/1 var(--font-body);
  cursor: pointer;
}
.mixbar button.empty { border: 2px dashed var(--line-strong); }
.mixbar canvas { display: block; width: 100%; height: 100%; }
.mixbar .num {
  position: absolute; top: 3px; left: 3px;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--accent); color: var(--on-accent);
  font: 700 11px/18px var(--font-body); text-align: center;
}
.savebtn { display: inline-flex; align-items: center; gap: 8px; }
.savebtn:disabled { opacity: 0.55; cursor: progress; }
.hint { margin: 0; font-size: 13px; color: var(--muted); max-width: 62ch; }

.row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 12px;
  align-items: center;
}
.row label { font: 600 13px/1.2 var(--font-body); color: var(--muted); }
.row input { grid-column: 1 / -1; width: 100%; min-height: 34px; accent-color: var(--accent); }

.pals {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
  gap: 10px;
}
.pal {
  aspect-ratio: 1;
  max-width: 100%;
  padding: 0;
  border: 2px solid var(--line-strong);
  border-radius: 50%;
  background: linear-gradient(135deg, var(--p0) 0 48%, var(--p1) 48% 74%, var(--p2) 74% 100%);
  cursor: pointer;
}
.pal[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 2px; }

.group > * { min-width: 0; }
.seg.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.seg.scroll button { flex: 0 0 auto; }
.seg.equal { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 6px; }
.seg.equal button { flex-direction: column; gap: 6px; padding: 10px 4px; min-height: 64px; font-size: 12.5px; border-radius: 14px; }
.seg.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.seg.cards button { flex-direction: column; gap: 6px; border-radius: 14px; padding: 10px 6px 8px; min-height: 92px; font-size: 13px; }
.seg.cards .dims { font: 500 11px/1 var(--font-body); opacity: 0.75; font-variant-numeric: tabular-nums; }
.shapebox { display: flex; align-items: center; justify-content: center; width: 100%; height: 44px; }
.shapebox i { display: block; border: 2px solid currentColor; border-radius: 4px; background: color-mix(in srgb, currentColor 14%, transparent); }
.shapebox i.free { border-style: dashed; }

.slider { display: grid; gap: 8px; }
.sl-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sl-head label { font: 600 14px/1.2 var(--font-body); color: var(--fg); }
.bubble {
  min-width: 52px; padding: 6px 12px; border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent);
  font: 700 15px/1 var(--font-body); text-align: center; font-variant-numeric: tabular-nums;
}
.sl-body { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; gap: 10px; align-items: center; }
.step {
  width: 48px; height: 48px; padding: 0; border-radius: 50%;
  border: 1px solid var(--line-strong); background: transparent; color: var(--fg);
  font: 600 24px/1 var(--font-body); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.step:disabled { opacity: 0.35; cursor: not-allowed; }
.sl-ends { display: flex; justify-content: space-between; gap: 12px; font: 500 12px/1.2 var(--font-body); color: var(--muted); padding-inline: 58px; }
.slider input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 48px; margin: 0; background: transparent; cursor: pointer; touch-action: pan-y;
  --pct: 50%;
}
.slider input[type="range"]::-webkit-slider-runnable-track {
  height: 12px; border-radius: 999px;
  background: linear-gradient(to right, var(--accent) var(--pct), var(--line) var(--pct));
}
.slider input[type="range"]::-moz-range-track { height: 12px; border-radius: 999px; background: var(--line); }
.slider input[type="range"]::-moz-range-progress { height: 12px; border-radius: 999px; background: var(--accent); }
.slider input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 34px; height: 34px; margin-top: -11px; border-radius: 50%;
  background: var(--surface); border: 4px solid var(--accent);
  box-shadow: 0 2px 6px var(--shadow);
}
.slider input[type="range"]::-moz-range-thumb {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--surface); border: 4px solid var(--accent);
  box-shadow: 0 2px 6px var(--shadow);
}
.slider input[type="range"]:focus-visible { outline-offset: 0; border-radius: 999px; }

.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(8px);
}
.dock-in { max-width: 1100px; margin-inline: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.dockbtn {
  min-height: 56px; padding: 8px 6px; border-radius: 14px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg);
  font: 700 12px/1.1 var(--font-body); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
}
.dockbtn.main { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.dockbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.dockbtn:disabled { opacity: 0.45; cursor: not-allowed; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 11;
  max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 999px;
  background: var(--fg); color: var(--bg); font: 600 13px/1.3 var(--font-body); text-align: center;
  box-shadow: 0 6px 20px var(--shadow);
}
.toast:empty { display: none; }
.pal.custom { border-style: dashed; }
.editor { display: grid; gap: 12px; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; }
.slots button {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 48px;
  padding: 8px 14px 8px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: transparent;
  color: var(--fg);
  font: 600 14px/1 var(--font-body);
  cursor: pointer;
}
.slots button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.dot { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-strong); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 8px; }
.sw { aspect-ratio: 1; max-width: 100%; padding: 0; border: 2px solid var(--line-strong); border-radius: 10px; cursor: pointer; }
.sw[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 2px; }

@media (min-width: 880px) {
  .app {
    grid-template-columns: minmax(0, 1.25fr) minmax(340px, 0.75fr);
    align-items: start;
    gap: 24px;
  }
  .sheet-wrap { top: calc(env(safe-area-inset-top, 0px) + 8px); }
  .sheet { --maxh: clamp(380px, 74vh, 700px); }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>

<header class="top">
  <h1>Pattern Roll</h1>
  <button type="button" id="surprise" class="btn">Surprise me</button>
</header>

<main class="app">
  <section class="sheet-wrap" aria-label="Pattern sheet">
    <div class="sheet" id="sheetBox">
      <canvas id="sheet" role="img" aria-label="Pattern sheet. Tap a tile to change or turn it."></canvas>
    </div>
    <div class="perf" aria-hidden="true">tear here</div>
  </section>

  <section class="controls" aria-label="Pattern controls">
    <div class="group">
      <h2>Motif</h2>
      <div class="seg equal" style="--n:4" id="seg-mode" role="group" aria-label="What tapping a motif does"></div>
      <div class="seg scroll" id="seg-cat" role="group" aria-label="Types of motif. Switch on as many as you like."></div>
      <div class="mixbar" id="mixbar" role="group" aria-label="Your mix" hidden></div>
      <div class="tray" id="tray" role="group" aria-label="Motifs"></div>
      <div class="field" id="field-mix" hidden>
        <span class="lab" id="lab-mix">How to mix them</span>
        <div class="seg" id="seg-mixRule" role="group" aria-labelledby="lab-mix"></div>
      </div>
      <p class="hint" id="hint"></p>
    </div>

    <div class="group">
      <h2>Arrange</h2>
      <div class="field">
        <span class="lab" id="lab-format">Sheet shape</span>
        <div class="seg cards" id="seg-format" role="group" aria-labelledby="lab-format"></div>
      </div>
      <div class="field">
        <span class="lab" id="lab-layout">Layout</span>
        <div class="seg equal" id="seg-layout" role="group" aria-labelledby="lab-layout"></div>
      </div>
      <div class="field">
        <span class="lab" id="lab-turn">Turns</span>
        <div class="seg equal" style="--n:4" id="seg-turn" role="group" aria-labelledby="lab-turn"></div>
      </div>
      <div class="slider">
        <div class="sl-head"><label for="cols">Tiles across</label><output class="bubble" id="colsOut" for="cols">5</output></div>
        <div class="sl-body">
          <button type="button" class="step" data-for="cols" data-d="-1" aria-label="Fewer tiles">−</button>
          <input type="range" id="cols" min="3" max="12" step="1" value="5">
          <button type="button" class="step" data-for="cols" data-d="1" aria-label="More tiles">+</button>
        </div>
        <div class="sl-ends"><span>Fewer, bigger</span><span>More, smaller</span></div>
      </div>
      <div class="slider">
        <div class="sl-head"><label for="size">Motif size</label><output class="bubble" id="sizeOut" for="size">80%</output></div>
        <div class="sl-body">
          <button type="button" class="step" data-for="size" data-d="-1" aria-label="Smaller motifs">−</button>
          <input type="range" id="size" min="40" max="100" step="2" value="80">
          <button type="button" class="step" data-for="size" data-d="1" aria-label="Bigger motifs">+</button>
        </div>
        <div class="sl-ends"><span>Small</span><span>Fills the tile</span></div>
      </div>
      <div class="actions">
        <button type="button" class="chip" id="reset">Reset tiles</button>
      </div>
    </div>

    <div class="group">
      <h2>Look</h2>
      <div class="pals" id="pals" role="group" aria-label="Colours"></div>
      <p class="hint">The dashed circle is yours. Pick it to choose your own colours.</p>
      <div class="editor" id="editor" hidden>
        <div class="slots" id="slots" role="group" aria-label="Which colour to change"></div>
        <div class="swatches" id="swatches" role="group" aria-label="Pick a colour"></div>
        <div class="actions">
          <button type="button" class="chip" id="swapBtn">Swap background and main</button>
          <button type="button" class="chip" id="randBtn">Random colours</button>
        </div>
      </div>
      <div class="field">
        <span class="lab" id="lab-style">Finish</span>
        <div class="seg equal" style="--n:2" id="seg-style" role="group" aria-labelledby="lab-style"></div>
      </div>
    </div>
  </section>
</main>

<p class="toast" id="saveMsg" role="status" aria-live="polite"></p>
<nav class="dock" aria-label="Ripple and saving">
  <div class="dock-in">
    <button type="button" class="dockbtn" id="ripple" aria-pressed="false"><span class="ico" data-ico="ripple"></span>Ripple</button>
    <button type="button" class="dockbtn main" id="savePng"><span class="ico" data-ico="picture"></span>Save picture</button>
    <button type="button" class="dockbtn main" id="saveGif"><span class="ico" data-ico="film"></span>Save animation</button>
  </div>
</nav>

<script>
(function () {
  'use strict';
    var TAU = Math.PI * 2;

  /* ---------- shape helpers (unit space, roughly -1 to 1) ---------- */
  function circ(c, x, y, r) { c.moveTo(x + r, y); c.arc(x, y, r, 0, TAU); }
  function poly(c, pts) {
    for (var i = 0; i < pts.length; i++) {
      if (i) c.lineTo(pts[i][0], pts[i][1]); else c.moveTo(pts[i][0], pts[i][1]);
    }
    c.closePath();
  }
  function reg(n, r, off) {
    if (off === undefined) off = -Math.PI / 2;
    return function (c) {
      var pts = [];
      for (var i = 0; i < n; i++) {
        var a = off + i * TAU / n;
        pts.push([Math.cos(a) * r, Math.sin(a) * r]);
      }
      poly(c, pts);
    };
  }
  function star(n, ro, ri) {
    return function (c) {
      var pts = [];
      for (var i = 0; i < n * 2; i++) {
        var a = -Math.PI / 2 + i * Math.PI / n;
        var r = i % 2 ? ri : ro;
        pts.push([Math.cos(a) * r, Math.sin(a) * r]);
      }
      poly(c, pts);
    };
  }

  function rrect(c, x, y, w, h, r) {
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y); c.arcTo(x + w, y, x + w, y + r, r);
    c.lineTo(x + w, y + h - r); c.arcTo(x + w, y + h, x + w - r, y + h, r);
    c.lineTo(x + r, y + h); c.arcTo(x, y + h, x, y + h - r, r);
    c.lineTo(x, y + r); c.arcTo(x, y, x + r, y, r);
    c.closePath();
  }
  function crenel(c, x, w, y) {
    var mw = w / 5;
    for (var i = 0; i < 3; i++) c.rect(x + i * 2 * mw, y - 0.16, mw, 0.16);
  }

  /* Each motif calls S(role, build). Roles: 'a' main colour, 'b' accent colour, 'cut' background colour.
     Accent and cut shapes stay inside a main shape so every colour set and the embossed finish read clearly. */
  var MOTIFS = [
    { name: 'Dot', draw: function (S) { S('a', function (c) { circ(c, 0, 0, 0.62); }); } },
    { name: 'Ring', draw: function (S) {
        S('a', function (c) { circ(c, 0, 0, 0.86); });
        S('cut', function (c) { circ(c, 0, 0, 0.56); });
        S('b', function (c) { circ(c, 0, 0, 0.22); });
    } },
    { name: 'Diamond', draw: function (S) {
        S('a', reg(4, 0.92));
        S('b', reg(4, 0.42));

      return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  }
  function ratio(h1, h2) {
    var a = lum(h1), b = lum(h2);
    return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
  }
  $('swapBtn').addEventListener('click', function () {
    var t = custom.bg; custom.bg = custom.a; custom.a = t; customChanged();
  });
  $('randBtn').addEventListener('click', function () {
    var bg = pick(SWATCHES), a, b, n = 0;
    do { a = pick(SWATCHES); n++; } while (ratio(bg, a) < 3 && n < 60);
    n = 0;
    do { b = pick(SWATCHES); n++; } while ((b === bg || b === a || ratio(a, b) < 1.8) && n < 60);
    custom.bg = bg; custom.a = a; custom.b = b;
    customChanged();
  });

  var HINTS = {
    fill: 'Pick a motif to fill the whole sheet. Tap a tile to turn it.',
    mix3: 'Fill the 3 slots with motifs from any types. Tap a filled slot to remove it. Tap a tile on the sheet to turn it.',
    mix5: 'Fill the 5 slots with motifs from any types. Tap a filled slot to remove it. Tap a tile on the sheet to turn it.',
    paint: 'Pick a brush, then tap or drag across tiles to place it. Tap a tile that already has the brush to turn it.'
  };
  function updateHint() { $('hint').textContent = HINTS[state.mode]; }
  function syncMixUI() { $('field-mix').hidden = !isMix() || state.sel.length < 2; }
  function syncUI() {
    ['layout', 'turn', 'style', 'mode', 'format', 'mixRule'].forEach(function (k) { syncSeg('seg-' + k, k); });
    showSliders();
    palBtns.forEach(function (b, i) { b.setAttribute('aria-pressed', String(i === state.pal)); });
    applyCat();
    updateHint();
    syncMixUI();
    syncEditor();
    applyFormat();
  }

  buildSeg('seg-mode', MODES, 'mode', function () {
    if (state.mode === 'fill' && state.sel.length > 1) { state.sel = [state.sel[0]]; painted.clear(); turns.clear(); draw(); }
    if (isMix()) {
      while (state.sel.length > maxSel()) state.sel.pop();
      painted.clear(); turns.clear(); draw();
    }
    updateHint(); syncMixUI(); renderIcons();
  });
  (function buildFormats() {
    var el = $('seg-format');
    FORMATS.forEach(function (f) {
      var b = document.createElement('button');
      b.type = 'button';
      b.dataset.v = f[0];
      var box = document.createElement('span');
      box.className = 'shapebox';
      var rect = document.createElement('i');
      var ratio = f[2] ? f[2] / f[3] : 0.8;
      var h = ratio >= 1 ? Math.max(14, Math.round(36 / ratio)) : 36;
      var w = ratio >= 1 ? 36 : Math.round(36 * ratio);
      if (ratio >= 1) { w = Math.min(60, Math.round(h * ratio)); }
      if (!f[2]) rect.className = 'free';
      rect.style.width = w + 'px'; rect.style.height = h + 'px';
      box.appendChild(rect);
      b.appendChild(box);
      b.appendChild(document.createTextNode(f[1]));
      if (f[2]) {
        var d = document.createElement('span');
        d.className = 'dims';
        d.textContent = f[2] + '×' + f[3];
        b.appendChild(d);
      }
      b.addEventListener('click', function () { state.format = f[0]; syncSeg('seg-format', 'format'); applyFormat(); });
      el.appendChild(b);
    });
  })();
  buildSeg('seg-mixRule', MIXES, 'mixRule', function () { draw(); });
  buildSeg('seg-layout', LAYOUTS, 'layout', function () { draw(); });
  buildSeg('seg-turn', TURNS, 'turn', function () { draw(); });
  buildSeg('seg-style', STYLES, 'style', function () { renderIcons(); draw(); });

  function updatePct(el) {
    var pct = (el.value - el.min) / (el.max - el.min) * 100;
    el.style.setProperty('--pct', pct + '%');
  }
  function showSliders() {
    $('cols').value = state.cols; $('colsOut').textContent = state.cols;
    $('size').value = state.size; $('sizeOut').textContent = state.size + '%';
    updatePct($('cols')); updatePct($('size'));
    var steps = document.querySelectorAll('.step');
    for (var q = 0; q < steps.length; q++) {
      var inp = $(steps[q].dataset.for), d = +steps[q].dataset.d;
      steps[q].disabled = d < 0 ? +inp.value <= +inp.min : +inp.value >= +inp.max;
    }
  }
  $('cols').addEventListener('input', function (e) { state.cols = +e.target.value; showSliders(); draw(); });
  $('size').addEventListener('input', function (e) { state.size = +e.target.value; showSliders(); draw(); });
  (function wireSteps() {
    var steps = document.querySelectorAll('.step');
    for (var q = 0; q < steps.length; q++) {
      steps[q].addEventListener('click', function (e) {
        var b = e.currentTarget, inp = $(b.dataset.for);
        var by = inp.id === 'size' ? 4 : 1;
        var v = Math.min(+inp.max, Math.max(+inp.min, +inp.value + by * +b.dataset.d));
        inp.value = v;
        inp.dispatchEvent(new Event('input'));
      });
    }
  })();
  $('reset').addEventListener('click', function () { painted.clear(); turns.clear(); draw(); });

  /* ---------- ripple ---------- */
  var raf = 0, lastFrame = 0;
  function loop(ts) {
    if (!state.ripple) { raf = 0; return; }
    if (ts - lastFrame > 33) { lastFrame = ts; draw(ts); }
    raf = requestAnimationFrame(loop);
  }
  var rippleBtn = $('ripple');
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) {
    rippleBtn.disabled = true;
    rippleBtn.title = 'Motion is turned off in your device settings';
  }
  rippleBtn.addEventListener('click', function () {
    state.ripple = !state.ripple;
    rippleBtn.setAttribute('aria-pressed', String(state.ripple));
    if (state.ripple && !raf) raf = requestAnimationFrame(loop);
    if (!state.ripple) draw();
  });

  /* ---------- surprise me ---------- */
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function surprise() {
    var pal; do { pal = Math.floor(Math.random() * PALETTES.length); } while (pal === state.pal);
    state.pal = pal;
    var n = Math.random() < 0.5 ? 1 : 2 + Math.floor(Math.random() * 4);
    state.sel = [];
    while (state.sel.length < n) {
      var m = Math.floor(Math.random() * MOTIFS.length);
      if (state.sel.indexOf(m) < 0) state.sel.push(m);
    }
    state.brush = state.sel[0];
    state.mode = n === 1 ? 'fill' : (n <= 3 ? 'mix3' : 'mix5');
    state.mixRule = pick(MIXES)[0];
    state.cats = [];
    state.sel.forEach(function (m) { var c = MOTIFS[m].cat || 'shapes'; if (state.cats.indexOf(c) < 0) state.cats.push(c); });
    state.cat0 = state.cats[0];
    state.layout = pick(LAYOUTS)[0];
    state.turn = pick(TURNS)[0];
    state.cols = 3 + Math.floor(Math.random() * 8);
    state.size = 60 + 2 * Math.floor(Math.random() * 18);
    state.style = Math.random() < 0.7 ? 'flat' : 'emboss';
    state.seed = Math.floor(Math.random() * 1e6);
    painted.clear(); turns.clear();
    if (n === 1 && Math.random() < 0.5) {
      var second; do { second = Math.floor(Math.random() * MOTIFS.length); } while (second === state.sel[0]);
      var checker = Math.random() < 0.5;
      for (var r = -2; r <= 40; r++) {
        for (var c = -2; c <= 40; c++) {
          if (checker ? ((r + c) & 1) : (r & 1)) painted.set(r + ',' + c, second);
        }
      }
    }
    syncUI();
    draw();
  }
  $('surprise').addEventListener('click', surprise);

  /* ---------- sheet shape ---------- */
  function applyFormat() {
    var f = fmtOf(state.format);
    if (f[2]) {
      sheetBox.classList.add('fixed');
      sheetBox.style.setProperty('--ar', f[2] + ' / ' + f[3]);
    } else {
      sheetBox.classList.remove('fixed');
      sheetBox.style.removeProperty('--ar');
    }
    resize();
  }

  /* ---------- saving ---------- */
  var downloads = null;
  var saveMsg = $('saveMsg'), pngBtn = $('savePng'), gifBtn = $('saveGif');
  var sayTimer = 0;
  function say(t) {
    saveMsg.textContent = t || '';
    clearTimeout(sayTimer);
    if (t) sayTimer = setTimeout(function () { saveMsg.textContent = ''; }, 6000);
  }
  function exportSize(longEdge) {
    var f = fmtOf(state.format), w = f[2], h = f[3];
    if (!w) { w = canvas.width; h = canvas.height; }
    var k = longEdge ? Math.min(1, longEdge / Math.max(w, h)) : 1;
    return [Math.max(2, Math.round(w * k)), Math.max(2, Math.round(h * k))];
  }
  function stamp() { return fmtOf(state.format)[0]; }
  function handleSaveError(e) {
    var code = e && e.code;
    if (code === 'declined') say('Not saved.');
    else if (code === 'rate_limited') say('Another save is waiting. Answer it first, then try again.');
    else if (code === 'too_large') say('The file is too large. Try the Square or Fit screen shape.');
    else say('Saving did not work here.');
  }
  /* Inside the Android app a small native bridge saves the file into the gallery. */
  function androidSaver() {
    if (!window.AndroidSave) return null;
    return {
      save: function (req) {
        return new Promise(function (resolve, reject) {
          var fr = new FileReader();
          fr.onload = function () {
            try {
              var b64 = String(fr.result).split(',')[1] || '';
              var mime = /\.gif$/i.test(req.filename) ? 'image/gif' : 'image/png';
              if (window.AndroidSave.save(req.filename, mime, b64)) resolve({ status: 'saved' });
              else reject({ code: 'unavailable' });
            } catch (e) { reject({ code: 'unavailable' }); }
          };
          fr.onerror = function () { reject({ code: 'bad_request' }); };
          fr.readAsDataURL(req.data);
        });
      }
    };
  }
  function tryDownloads() {
    if (downloads) return Promise.resolve(downloads);
    var native = androidSaver();
    if (native) { downloads = native; return Promise.resolve(native); }
    if (!(window.claude && window.claude.use)) return Promise.resolve(null);
    return window.claude.use('downloads').then(function (d) { downloads = d; return d; }, function () { return null; });
  }
  tryDownloads().then(function (d) {
    if (!d) { pngBtn.disabled = true; gifBtn.disabled = true; pngBtn.title = gifBtn.title = 'Saving is not available in this view'; }
  });
  pngBtn.addEventListener('click', function () {
    tryDownloads().then(function (d) {
      if (!d) { say('Saving is not available in this view.'); return; }
      var wh = exportSize(0), cv = document.createElement('canvas');
      cv.width = wh[0]; cv.height = wh[1];
      var g = cv.getContext('2d');
      var scale = getDpr() * wh[0] / Math.max(1, canvas.width);
      paintSheet(g, wh[0], wh[1], 0, scale, false, false);
      say('Making the picture…');
      cv.toBlob(function (blob) {
        if (!blob) { say('Could not make the picture.'); return; }
        d.save({ filename: 'pattern-roll-' + stamp() + '.png', data: blob }).then(
          function () { say('Picture saved.'); }, handleSaveError);
      }, 'image/png');
    });
  });
  var GIF_FRAMES = 30;
  gifBtn.addEventListener('click', function () {
    tryDownloads().then(function (d) {
      if (!d) { say('Saving is not available in this view.'); return; }
      gifBtn.disabled = true; pngBtn.disabled = true;
      var wh = exportSize(600), W = wh[0], H = wh[1];
      var cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      var g = cv.getContext('2d', { willReadFrequently: true });
      var scale = getDpr() * W / Math.max(1, canvas.width);
      var period = 2 * Math.PI * RIPPLE_MS;
      function frameData(i) {
        paintSheet(g, W, H, i * period / GIF_FRAMES, scale, true, false);
        return g.getImageData(0, 0, W, H).data;
      }
      var P = null, out = [], i = 0;
      function done(e) { gifBtn.disabled = false; pngBtn.disabled = false; if (e) handleSaveError(e); }
      function step() {
        try {
          if (!P) {
            say('Choosing colours…');
            P = gifPalette([frameData(0), frameData(Math.round(GIF_FRAMES / 3)), frameData(Math.round(2 * GIF_FRAMES / 3))]);
            gifHeader(W, H, P, out);
            return setTimeout(step, 0);
          }
          if (i < GIF_FRAMES) {
            say('Making frame ' + (i + 1) + ' of ' + GIF_FRAMES + '…');
            gifFrame(W, H, frameData(i), P, 9, out);
            i++;
            return setTimeout(step, 0);
          }
          out.push(0x3B);
          var blob = new Blob([new Uint8Array(out)], { type: 'image/gif' });
          say('Ready to save…');
          d.save({ filename: 'pattern-roll-' + stamp() + '.gif', data: blob }).then(
            function () { say('Animation saved (' + W + ' × ' + H + ', loops forever).'); done(); }, done);
        } catch (err) {
          say('Could not make the animation.'); done();
        }
      }
      step();
    });
  });

  /* ---------- sizing ---------- */
  function resize() {
    var r = sheetBox.getBoundingClientRect();
    var dpr = getDpr();
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    draw();
  }
  if (window.ResizeObserver) {
    new ResizeObserver(resize).observe(sheetBox);
    new ResizeObserver(renderIcons).observe(tray);
  } else {
    window.addEventListener('resize', function () { resize(); renderIcons(); });
  }
  fillIcons();
  syncUI();
  resize();
})();
</script>

</body></html>
